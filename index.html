<style>
  :root {
    --bg: #14181c;
    --surface: #1b2127;
    --surface-2: #232a31;
    --border: #2b333b;
    --text: #e9e5db;
    --text-muted: #8b939b;
    --amber: #e8a33d;
    --green: #6fbf8b;
    --red: #c4634f;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, monospace;

  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  body { min-height: 100vh; padding: 40px 20px 64px; }

  .console { max-width: 640px; margin: 0 auto; }

  .langbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 26px; }

  .langbtn {
    font-family: var(--mono);
    font-size: 0.75rem;
    min-height: 32px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 100px;
    cursor: pointer;
  }

  .langbtn:hover { color: var(--text); border-color: var(--text-muted); }

  .langbtn[aria-pressed="true"] {
    color: #1a1305;
    background: var(--amber);
    border-color: var(--amber);
    font-weight: 700;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 10px;
  }

  h1 {
    font-family: var(--mono);
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 14px;
  }

  h1 .dim { color: var(--text-muted); font-weight: 500; }

  .lede {
    font-size: 0.98rem;
    line-height: 1.6;
    color: var(--text-muted);
    margin: 0 0 28px;
    max-width: 54ch;
  }

  .tuner { display: flex; gap: 10px; margin-bottom: 36px; }

  .tuner input {
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.95rem;
    padding: 13px 14px;
    border-radius: 8px;
  }

  .tuner input::placeholder { color: var(--text-muted); }

  .tuner button {
    background: var(--amber);
    color: #1a1305;
    border: none;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    padding: 13px 20px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }

  .tuner button:hover { background: #f0b358; }

  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .channels { display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px; }

  .channel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }

  .channel__head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }

  .channel__head h2 {
    font-family: var(--mono);
    font-size: 1rem;
    font-weight: 600;
    margin: 0;
    flex: 1;
  }

  .channel__tag {
    font-family: var(--mono);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    background: var(--surface-2);
    padding: 3px 8px;
    border-radius: 100px;
    white-space: nowrap;
  }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
  .dot--amber { background: var(--amber); }
  .dot--green { background: var(--green); }
  .dot--red { background: var(--red); }

  .channel__desc { font-size: 0.88rem; line-height: 1.55; color: var(--text-muted); margin: 0 0 12px; }

  .channel__hint { font-size: 0.82rem; color: var(--text-muted); margin: 10px 0 0; }

  .channel__hint code {
    font-family: var(--mono);
    background: var(--surface-2);
    padding: 2px 6px;
    border-radius: 4px;
  }

  .channel__actions { display: flex; flex-wrap: wrap; gap: 16px; }

  .channel__actions a {
    color: var(--amber);
    font-size: 0.88rem;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .channel__actions a:hover { border-bottom-color: var(--amber); }

  .sweep {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
    margin: 4px 0 14px;
  }

  .sweep span {
    position: absolute;
    top: 0; left: -30%;
    width: 30%; height: 100%;
    background: var(--amber);
    animation: sweep 1.3s ease-in-out infinite;
  }

  @keyframes sweep {
    0% { left: -30%; }
    50% { left: 100%; }
    100% { left: -30%; }
  }

  .channel__frame {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 10px;
    background: #0c0f12;
  }

  .channel__frame iframe { width: 100%; height: 320px; border: 0; display: block; }

  .frame__caption { font-size: 0.78rem; color: var(--text-muted); margin: 0 0 12px; }

  .why {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 20px;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .why summary { cursor: pointer; padding: 14px 0; font-family: var(--mono); font-size: 0.8rem; color: var(--text); }

  .why p { line-height: 1.6; margin: 0 0 16px; }

  footer { margin-top: 28px; font-size: 0.78rem; color: var(--text-muted); text-align: center; }

  .tuner input[aria-invalid="true"] { border-color: var(--red); }
  #handleError.errmsg { color: #e8917d; font-size: 0.85rem; margin: -26px 0 30px; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  @media (max-width: 480px) {
    h1 { font-size: 1.7rem; }
    .tuner { flex-direction: column; }
    .tuner button { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sweep span { animation: none; left: 0; width: 100%; opacity: 0.4; }
  }
</style>
</head>

          <span class="channel__tag" id="txtDirectTag"></span>

          <a id="linkTwitter" target="_blank" rel="noopener noreferrer"></a>
        </div>
        <p class="channel__hint" id="txtDirectHint"></p>
      </article>

      <article class="channel">

        </div>

        <div class="channel__actions" id="archiveActions"></div>

          <span class="dot dot--red"></span>
          <h2 id="txtNitterH2"></h2>
          <span class="channel__tag" id="txtNitterTag"></span>
        </div>
        <p class="channel__desc" id="txtNitterDesc"></p>
        <div class="channel__actions">
          <a href="https://github.com/zedeus/nitter/wiki/Instances" target="_blank" rel="noopener noreferrer" id="txtNitterLink"></a>
        </div>
        <p class="channel__hint"><span id="txtNitterHintPrefix"></span> <code><span id="txtNitterHintDomain"></span>/<span id="nitterHandlePreview">handle</span></code>.</p>
      </article>

    </section>

    <details class="why">
      <summary id="txtWhySummary"></summary>
      <p id="txtWhyP1"></p>
      <p id="txtWhyP2"></p>
    </details>

    <footer id="txtFooter"></footer>
  </main>

  // Returns a valid X handle ([A-Za-z0-9_]{1,15}) or "" if input is empty/invalid.
  function extractHandle(raw) {
    var s = (raw || "").trim();
    if (!s) return "";
    if (/^(https?:\/\/)?((www|mobile)\.)?(x|twitter)\.com\//i.test(s) || /^https?:\/\//i.test(s)) {
      try {
        var u = new URL(/^https?:\/\//i.test(s) ? s : "https://" + s);
        var parts = u.pathname.split("/").filter(Boolean);
        s = parts[0] || "";
      } catch (e) { return ""; }
    }
    s = s.replace(/^@/, "");
    s = s.split(/[\/?#]/)[0].trim();
    return /^[A-Za-z0-9_]{1,15}$/.test(s) ? s : "";
  }

  // Accept only https snapshots hosted on web.archive.org (API may return http:// URLs).
  function safeSnapshotUrl(raw) {

    } catch (e) { return ""; }

    var x = EXTRA[state.lang];

    if (state.archiveStatus === "idle") return;

    archiveActions.textContent = "";

    if (state.archiveStatus === "checking") {
      archiveDot.className = "dot dot--amber";
      archiveDesc.textContent = t.archive.checking;
      archiveSweep.hidden = false;
      archiveFrameWrap.hidden = true;
      frameCaption.hidden = true;
      return;
    }

    archiveSweep.hidden = true;
    frameCaption.textContent = t.archive.frameCaption;
    var safeUrl = state.archiveStatus === "found" && state.archiveSnap ? safeSnapshotUrl(state.archiveSnap.url) : "";

    if (safeUrl) {
      var when = formatSnapDate(String(state.archiveSnap.timestamp || ""), state.lang);
      archiveDot.className = "dot dot--green";
      archiveDesc.textContent = t.archive.found(when);
      archiveFrameWrap.hidden = false;
      frameCaption.hidden = false;
      if (archiveFrame.getAttribute("src") !== safeUrl) archiveFrame.src = safeUrl;
      archiveActions.appendChild(makeLink(safeUrl, t.archive.openWayback));
    } else {
      archiveFrameWrap.hidden = true;
      frameCaption.hidden = true;
      archiveFrame.removeAttribute("src");
      var saveUrl = "https://web.archive.org/save/https://x.com/" + encodeURIComponent(state.handle);
      if (state.archiveStatus === "error") {
        archiveDot.className = "dot dot--red";
        archiveDesc.textContent = x.error;
        archiveActions.appendChild(makeLink("https://web.archive.org/web/2/https://x.com/" + encodeURIComponent(state.handle), t.archive.openWayback));
      } else {
        archiveDot.className = "dot dot--red";
        archiveDesc.textContent = t.archive.notFound;
        archiveActions.appendChild(makeLink(saveUrl, t.archive.requestNew));
      }
    }
  }

  var TIMEOUT_MS = 8000;
  var archiveCtl = null;

  async function checkArchive(handle) {
    // Cancel any in-flight lookup so a stale answer can never overwrite a newer one.
    if (archiveCtl) archiveCtl.abort();
    var ctl = new AbortController();
    archiveCtl = ctl;
    var timer = setTimeout(function () { ctl.abort(); }, TIMEOUT_MS);

    state.archiveStatus = "checking";
    state.archiveSnap = null;
    renderArchiveStatus();

    var targets = ["https://x.com/" + handle, "https://twitter.com/" + handle];
    var found = null, failures = 0;

    for (var i = 0; i < targets.length; i++) {
      try {
        var res = await fetch("https://archive.org/wayback/available?url=" + encodeURIComponent(targets[i]),
          { signal: ctl.signal, credentials: "omit", referrerPolicy: "no-referrer" });
        if (!res.ok) { failures++; continue; }
        var data = await res.json();
        var snap = data && data.archived_snapshots && data.archived_snapshots.closest;
        if (snap && snap.available && snap.url && safeSnapshotUrl(snap.url)) { found = snap; break; }
      } catch (e) {
        if (ctl.signal.aborted && archiveCtl !== ctl) { clearTimeout(timer); return; } // superseded
        failures++;
        if (ctl.signal.aborted) break; // timeout
      }
    }
    clearTimeout(timer);
    if (archiveCtl !== ctl) return;

    state.archiveStatus = found ? "found" : (failures >= targets.length || (failures && !found) ? "error" : "notfound");
    state.archiveSnap = found;
    renderArchiveStatus();
  }

  function render() {
    var t = STRINGS[state.lang];
    document.documentElement.lang = state.lang;
    document.title = t.title;

    txtEyebrow.textContent = t.eyebrow;
    txtH1Prep.textContent = t.h1Prep;
    txtH1Noun.textContent = t.h1Noun;
    txtLede.textContent = t.lede;
    txtInputLabel.textContent = t.inputLabel;
    input.placeholder = t.placeholder;
    txtScanBtn.textContent = t.scanBtn;

    txtDirectH2.textContent = t.direct.h2;
    txtDirectTag.textContent = t.direct.tag;
    txtDirectDesc.textContent = t.direct.desc;
    txtDirectHint.textContent = t.direct.hint;

    txtArchiveH2.textContent = t.archive.h2;
    txtArchiveTag.textContent = t.archive.tag;
    archiveFrame.title = t.archive.frameTitle;

    txtIndexH2.textContent = t.index.h2;
    txtIndexTag.textContent = t.index.tag;
    txtIndexDesc.textContent = t.index.desc;
    linkGoogle.textContent = t.index.google;
    linkBing.textContent = t.index.bing;

    txtNitterH2.textContent = t.nitter.h2;
    txtNitterTag.textContent = t.nitter.tag;
    txtNitterDesc.textContent = t.nitter.desc;
    txtNitterLink.textContent = t.nitter.link;
    txtNitterHintPrefix.textContent = t.nitter.hintPrefix;
    txtNitterHintDomain.textContent = t.nitter.hintDomain;

    txtWhySummary.textContent = t.why.summary;
    txtWhyP1.textContent = t.why.p1;
    txtWhyP2.textContent = t.why.p2;

    txtFooter.textContent = t.footer;

    if (state.handle) applyHandleLinks();
    renderArchiveStatus();

    var btns = langbar.querySelectorAll(".langbtn");
    for (var i = 0; i < btns.length; i++) {
      var pressed = btns[i].getAttribute("data-lang") === state.lang;
      btns[i].setAttribute("aria-pressed", pressed ? "true" : "false");
    }
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var handle = extractHandle(input.value);
    var errEl = document.getElementById("handleError");
    if (!handle) {
      input.setAttribute("aria-invalid", "true");
      errEl.className = "errmsg";
      errEl.textContent = input.value.trim() ? EXTRA[state.lang].invalid : "";
      input.focus();
      return;
    }
    input.removeAttribute("aria-invalid");
    errEl.className = "visually-hidden";
    errEl.textContent = "";
    state.handle = handle;
    applyHandleLinks();
    channels.hidden = false;
    checkArchive(handle);
  });

  langbar.addEventListener("click", function (e) {
    var btn = e.target.closest(".langbtn");
    if (!btn) return;
    var lang = btn.getAttribute("data-lang");
    if (SUPPORTED.indexOf(lang) === -1) return;
    state.lang = lang;
    render();
  });

  render();
})();
</script>
</body>
</html>
