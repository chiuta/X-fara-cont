<style>
  :root {
    --bg: #14181c;
    --surface: #1b2127;
    --surface-2: #232a31;
    --border: #2b333b;
    --text: #e9e5db;
    --text-muted: #8b939b;
    --amber: #e8a33d;
    --green: #6fbf8b;
    --red: #c4634f;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  body { min-height: 100vh; padding: 40px 20px 64px; }

  .console { max-width: 640px; margin: 0 auto; }

  .langbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 26px; }

  .langbtn {
    font-family: var(--mono);
    font-size: 0.75rem;
    min-height: 32px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 100px;
    cursor: pointer;
  }

  .langbtn:hover { color: var(--text); border-color: var(--text-muted); }

  .langbtn[aria-pressed="true"] {
    color: #1a1305;
    background: var(--amber);
    border-color: var(--amber);
    font-weight: 700;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 10px;
  }

  h1 {
    font-family: var(--mono);
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 14px;
  }

  h1 .dim { color: var(--text-muted); font-weight: 500; }

  .lede {
    font-size: 0.98rem;
    line-height: 1.6;
    color: var(--text-muted);
    margin: 0 0 28px;
    max-width: 54ch;
  }

  .inputhint { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 12px; }
  .tuner { display: flex; gap: 10px; margin-bottom: 36px; }

  .tuner input {
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 0.95rem;
    padding: 13px 14px;
    border-radius: 8px;
  }

  .tuner input::placeholder { color: var(--text-muted); }

  .tuner button {
    background: var(--amber);
    color: #1a1305;
    border: none;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.02em;
    padding: 13px 20px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }

  .tuner button:hover { background: #f0b358; }

  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .channels { display: flex; flex-direction: column; gap: 14px; margin-bottom: 32px; }

  .channel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }

  .channel__head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }

  .channel__head h2 {
    font-family: var(--mono);
    font-size: 1rem;
    font-weight: 600;
    margin: 0;
    flex: 1;
  }

  .channel__tag {
    font-family: var(--mono);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    background: var(--surface-2);
    padding: 3px 8px;
    border-radius: 100px;
    white-space: nowrap;
  }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
  .dot--amber { background: var(--amber); }
  .dot--green { background: var(--green); }
  .dot--red { background: var(--red); }

  .channel__desc { font-size: 0.88rem; line-height: 1.55; color: var(--text-muted); margin: 0 0 12px; }

  .channel__hint { font-size: 0.82rem; color: var(--text-muted); margin: 10px 0 0; }

  .channel__hint code {
    font-family: var(--mono);
    background: var(--surface-2);
    padding: 2px 6px;
    border-radius: 4px;
  }

  .channel__actions { display: flex; flex-wrap: wrap; gap: 16px; }

  .channel__actions a {
    color: var(--amber);
    font-size: 0.88rem;
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }

  .channel__actions a:hover { border-bottom-color: var(--amber); }

  .sweep {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
    margin: 4px 0 14px;
  }

  .sweep span {
    position: absolute;
    top: 0; left: -30%;
    width: 30%; height: 100%;
    background: var(--amber);
    animation: sweep 1.3s ease-in-out infinite;
  }

  @keyframes sweep {
    0% { left: -30%; }
    50% { left: 100%; }
    100% { left: -30%; }
  }

  .channel__frame {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 10px;
    background: #0c0f12;
  }

  .channel__frame iframe { width: 100%; height: 320px; border: 0; display: block; }

  .frame__caption { font-size: 0.78rem; color: var(--text-muted); margin: 0 0 12px; }

  .why {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px 20px;
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .why summary { cursor: pointer; padding: 14px 0; font-family: var(--mono); font-size: 0.8rem; color: var(--text); }

  .why p { line-height: 1.6; margin: 0 0 16px; }

  footer { margin-top: 28px; font-size: 0.78rem; color: var(--text-muted); text-align: center; }

  .tuner input[aria-invalid="true"] { border-color: var(--red); }
  #handleError.errmsg { color: #e8917d; font-size: 0.85rem; margin: -26px 0 30px; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  @media (max-width: 480px) {
    h1 { font-size: 1.7rem; }
    .tuner { flex-direction: column; }
    .tuner button { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sweep span { animation: none; left: 0; width: 100%; opacity: 0.4; }
  }

  /* r7: fără depășire orizontală cu nume/linkuri lungi */
  .channel, .channel__actions a { min-width: 0; }
  .channel__actions a, .channel__hint code, .channel__desc { overflow-wrap: anywhere; }
  .channel__actions { max-width: 100%; }
  #postDate { font-variant-numeric: tabular-nums; }
</style>
